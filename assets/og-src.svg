<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="ogbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082A47"/>
      <stop offset="0.55" stop-color="#0B4E8C"/>
      <stop offset="1" stop-color="#0E6CC0"/>
    </linearGradient>
    <radialGradient id="ogglow" cx="0.82" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#19C6E6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#19C6E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oglux" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58D8F0"/><stop offset="1" stop-color="#19C6E6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#ogbg)"/>
  <rect width="1200" height="1200" fill="url(#ogglow)"/>

  <!-- design band: centered vertically (y 285..915) -->
  <g transform="translate(0,285)">
    <g opacity="0.9">
      <circle cx="150" cy="545" r="8" fill="#58D8F0" opacity="0.6"/>
      <circle cx="1140" cy="110" r="10" fill="#19C6E6" opacity="0.6"/>
      <path d="M250 140 l5 10 10 5 -10 5 -5 10 -5 -10 -10 -5 10 -5 z" fill="#FFFFFF" opacity="0.3"/>
    </g>

    <g transform="translate(840,150) scale(1.75)">
      <path d="M90 0 l80 34 v62 c0 58 -44 86 -80 108 c-36 -22 -80 -50 -80 -108 v-62 z" fill="#07243B"/>
      <path d="M90 22 l56 24 v46 c0 42 -30 62 -56 76 c-26 -14 -56 -34 -56 -76 v-46 z" fill="#19C6E6"/>
      <text x="90" y="112" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#07243B" text-anchor="middle">O₃</text>
      <g transform="translate(-4,188)"><circle cx="78" cy="0" r="11" fill="#19C6E6"/><circle cx="102" cy="13" r="11" fill="#58D8F0"/><circle cx="84" cy="26" r="11" fill="#0E7FD4"/></g>
    </g>

    <g transform="translate(90,70)">
      <circle cx="22" cy="22" r="20" fill="none" stroke="url(#oglux)" stroke-width="5"/>
      <circle cx="14" cy="18" r="5" fill="#19C6E6"/><circle cx="31" cy="18" r="5" fill="#58D8F0"/><circle cx="22" cy="31" r="5" fill="#FFFFFF"/>
      <text x="58" y="34" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="1" fill="#FFFFFF">OZO<tspan fill="#58D8F0">LUX</tspan></text>
    </g>

    <text x="90" y="236" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF">Профессиональное</text>
    <text x="90" y="304" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF">озонирование</text>
    <text x="92" y="360" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#CDEBF8">Плесень, вирусы и запахи — навсегда</text>

    <g font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="26">
      <rect x="90" y="430" width="312" height="60" rx="30" fill="#FFFFFF"/>
      <text x="246" y="469" fill="#0B4E8C" text-anchor="middle">Батуми · Кобулети</text>
      <rect x="420" y="430" width="196" height="60" rx="30" fill="#19C6E6"/>
      <text x="518" y="469" fill="#07243B" text-anchor="middle">от 200 ₾</text>
