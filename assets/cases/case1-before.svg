<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c1bwl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2ECE2"/><stop offset="1" stop-color="#E8E0D3"/></linearGradient>
    <linearGradient id="c1bwr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9E1D3"/><stop offset="1" stop-color="#DED4C3"/></linearGradient>
    <linearGradient id="c1bfl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CBA77C"/><stop offset="1" stop-color="#BE9A6C"/></linearGradient>
    <filter id="c1stain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="4" seed="11" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 0.26  0 0 0 1.3 -0.3"/>
    </filter>
    <filter id="c1mold" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.07" numOctaves="5" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.17  0 0 0 0 0.12  0 0 0 3 -1.25"/>
    </filter>
    <filter id="c1soft"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="c1soft2"><feGaussianBlur stdDeviation="30"/></filter>
    <mask id="c1stainMask">
      <rect width="600" height="450" fill="#000"/>
      <g filter="url(#c1soft2)" fill="#fff">
        <ellipse cx="250" cy="330" rx="300" ry="120"/>
        <rect x="200" y="150" width="110" height="210" rx="50"/>
      </g>
    </mask>
    <mask id="c1moldMask">
      <rect width="600" height="450" fill="#000"/>
      <g filter="url(#c1soft)" fill="#fff">
        <rect x="214" y="150" width="78" height="210" rx="38"/>
        <ellipse cx="250" cy="352" rx="210" ry="46" fill="#fff"/>
        <ellipse cx="135" cy="348" rx="95" ry="34"/>
        <ellipse cx="420" cy="350" rx="140" ry="30"/>
        <ellipse cx="258" cy="300" rx="70" ry="54"/>
        <ellipse cx="330" cy="330" rx="46" ry="30" opacity="0.7"/>
      </g>
    </mask>
  </defs>

  <rect width="600" height="450" fill="#EFE8DD"/>
  <polygon points="0,0 250,0 250,366 0,366" fill="url(#c1bwl)"/>
  <polygon points="250,0 600,0 600,366 250,366" fill="url(#c1bwr)"/>
  <rect x="246" y="0" width="8" height="366" fill="#000" opacity="0.05"/>

  <rect width="600" height="366" filter="url(#c1stain)" mask="url(#c1stainMask)" opacity="0.5"/>
  <rect width="600" height="366" filter="url(#c1mold)" mask="url(#c1moldMask)" opacity="0.9"/>

  <rect x="0" y="352" width="600" height="16" fill="#DBCFBB"/>
  <rect x="0" y="352" width="600" height="3" fill="#EAE0CF"/>
  <rect x="140" y="350" width="280" height="18" filter="url(#c1mold)" mask="url(#c1moldMask)" opacity="0.6"/>
  <rect x="0" y="366" width="600" height="84" fill="url(#c1bfl)"/>
  <g stroke="#A9865B" stroke-width="1.4" opacity="0.5">
    <line x1="0" y1="392" x2="600" y2="392"/><line x1="0" y1="418" x2="600" y2="418"/>
    <line x1="150" y1="366" x2="150" y2="392"/><line x1="430" y1="392" x2="430" y2="418"/><line x1="300" y1="418" x2="300" y2="450"/>
  </g>
